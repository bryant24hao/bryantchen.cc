<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="210" fill="#fafafa" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#71717a">File first, then resume, then close the source tab</text>

  <rect x="20" y="50" width="150" height="118" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="20" y="50" width="150" height="32" rx="10" fill="#eff6ff"/>
  <text x="95" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">1. Inventory</text>
  <text x="95" y="98" text-anchor="middle" font-size="11" fill="#3f3f46">Agent, UUID,</text>
  <text x="95" y="114" text-anchor="middle" font-size="11" fill="#3f3f46">intent — not cwd</text>

  <line x1="170" y1="109" x2="198" y2="109" stroke="#09090b" stroke-width="1.5"/>
  <polygon points="198,104 208,109 198,114" fill="#09090b"/>

  <rect x="208" y="50" width="150" height="118" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="208" y="50" width="150" height="32" rx="10" fill="#fefce8"/>
  <text x="283" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#ca8a04">2. Confirm</text>
  <text x="283" y="98" text-anchor="middle" font-size="11" fill="#3f3f46">Show the map.</text>
  <text x="283" y="114" text-anchor="middle" font-size="11" fill="#3f3f46">Human signs off.</text>

  <line x1="358" y1="109" x2="386" y2="109" stroke="#09090b" stroke-width="1.5"/>
  <polygon points="386,104 396,109 386,114" fill="#09090b"/>

  <rect x="396" y="50" width="150" height="118" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="396" y="50" width="150" height="32" rx="10" fill="#f0fdf4"/>
  <text x="471" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">3. Layout</text>
  <text x="471" y="98" text-anchor="middle" font-size="11" fill="#3f3f46">Workspace = bucket</text>
  <text x="471" y="114" text-anchor="middle" font-size="11" fill="#3f3f46">Tab = event</text>

  <line x1="546" y1="109" x2="574" y2="109" stroke="#09090b" stroke-width="1.5"/>
  <polygon points="574,104 584,109 574,114" fill="#09090b"/>

  <rect x="584" y="50" width="150" height="118" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="584" y="50" width="150" height="32" rx="10" fill="#faf5ff"/>
  <text x="659" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#9333ea">4. Resume</text>
  <text x="659" y="98" text-anchor="middle" font-size="11" fill="#3f3f46">Same UUID</text>
  <text x="659" y="114" text-anchor="middle" font-size="11" fill="#3f3f46">Do not fork</text>

  <line x1="734" y1="109" x2="762" y2="109" stroke="#09090b" stroke-width="1.5"/>
  <polygon points="762,104 772,109 762,114" fill="#09090b"/>

  <rect x="772" y="50" width="108" height="118" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
  <rect x="772" y="50" width="108" height="32" rx="10" fill="#09090b"/>
  <text x="826" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#fafafa">5. Close</text>
  <text x="826" y="98" text-anchor="middle" font-size="11" fill="#3f3f46">Source tab</text>
  <text x="826" y="114" text-anchor="middle" font-size="11" fill="#3f3f46">after history</text>
</svg>
