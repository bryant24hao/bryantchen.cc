egments":[{"index":0,"start_ms":300,"end_ms":7330,"timestamp":"00:00:00","speaker":"现场多人 / 短促插话","role":"group","role_confidence":"低","role_note":null,"original_speaker":"说话人1","zh":"确实没人知道。所以……","en":"No one really knows. So...","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-1","subchapter_title":"Chuan 欢迎致辞与活动缘起"},{"index":1,"start_ms":7330,"end_ms":58250,"timestamp":"00:00:07","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"大家好，欢迎来到 SparkLab。今天能在这里见到这么多人，真的太棒了。谢谢大家到场。我叫 Chuan，曾在滑铁卢学习计算机科学，也是一名全栈及 AI 开发者。在 SparkLab，我主要负责创业者关系和生态建设。我们希望把有趣的创业者和建设者聚在一起，看看会碰撞出怎样的新火花。今天的意义就是认识好奇的人、交流想法，并带着新的能量和灵感离开。","en":"Hi everyone, welcome to SparkLab. It's amazing to see so many people here today. Thank you all for coming. I'm Chuan. I studied computer science at Waterloo, and I'm also a full-stack and AI builder. At SparkLab, I focus on founder relations and ecosystem building. We bring interesting founders and builders together to see what new sparks might emerge. That's what today is about: meeting curious people, exchanging ideas, and hopefully leaving with new energy and inspiration.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-1","subchapter_title":"Chuan 欢迎致辞与活动缘起"},{"index":2,"start_ms":58250,"end_ms":87830,"timestamp":"00:00:58","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"我们希望认识有趣的人，交流信息和想法，最后带走新的灵感和启发。接下来请听听我们正在建设什么。","en":"We hope to meet interesting people, exchange information and ideas, and leave with new inspiration. Next, we'd like everyone to hear what we're building.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-1","subchapter_title":"Chuan 欢迎致辞与活动缘起"},{"index":3,"start_ms":87830,"end_ms":96010,"timestamp":"00:01:27","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"好的，Jack，交给你了。","en":"All right, Jack, take it away.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-1","subchapter_title":"Chuan 欢迎致辞与活动缘起"},{"index":4,"start_ms":96010,"end_ms":111980,"timestamp":"00:01:36","speaker":"SparkLab 介绍人 Jack","role":"jack","role_confidence":"较高","role_note":null,"original_speaker":"说话人3","zh":"谢谢大家今天来到这里，也谢谢 Marc。","en":"Thank you, everyone, for being here today. And thank you, Marc.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":5,"start_ms":111980,"end_ms":167030,"timestamp":"00:01:51","speaker":"SparkLab 介绍人 Jack","role":"jack","role_confidence":"较高","role_note":null,"original_speaker":"说话人3","zh":"我是 Spot Lab 的一员。下面用几页幻灯片非常简短地介绍一下 Spot Lab。幻灯片是中文的，但我会用英文讲。2024 年，我们为 20 岁以下的年轻创始人做了一个快闪式黑客屋；此后，我们继续推进并调整了方向。","en":"I'm from Spot Lab, and I'll give a very brief introduction with a few slides. The slides are in Chinese, but I'll present in English. In 2024, we built a pop-up hacker house for young founders under 20. Since then, we've kept moving forward and evolved the idea.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":6,"start_ms":167030,"end_ms":179390,"timestamp":"00:02:47","speaker":"SparkLab 介绍人 Jack","role":"jack","role_confidence":"较高","role_note":null,"original_speaker":"说话人3","zh":"现在，我们又回到了最初的‘火花’：从一个火花出发，你可以创办公司、做出产品，并把业务扩大。","en":"Now we're coming back to the original spark. From a spark, you can start a company, build a product, and scale a business.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":7,"start_ms":179390,"end_ms":219920,"timestamp":"00:02:59","speaker":"SparkLab 介绍人 Jack","role":"jack","role_confidence":"较高","role_note":null,"original_speaker":"说话人3","zh":"此前我们办过 S1、S2、S3 和 S4。现在基本模式是一种居住式加速器：每一季有 10 家初创团队，在这里共同生活、共同建设 42 天。","en":"Previously, we ran the S1, S2, S3, and S4 cohorts. We are essentially a residential accelerator: each season, ten startups live and build together here for 42 days.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":8,"start_ms":219920,"end_ms":222280,"timestamp":"00:03:39","speaker":"现场多人 / 短促插话","role":"group","role_confidence":"低","role_note":null,"original_speaker":"说话人4","zh":"继续。","en":"Go on.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":9,"start_ms":222280,"end_ms":337660,"timestamp":"00:03:42","speaker":"SparkLab 介绍人 Jack","role":"jack","role_confidence":"较高","role_note":null,"original_speaker":"说话人3","zh":"我们还会邀请艺术家和创作者分享他们的工作与生活。这里追求的不只是产品与市场契合，也希望参与者拥有更完整的生活体验。[部分内容听不清]","en":"We also invite artists and creators to talk about their work and lives. The residency is not only about achieving product-market fit; it's also about creating a fuller life experience. [Partly inaudible]","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":10,"start_ms":337660,"end_ms":362480,"timestamp":"00:05:37","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"欢迎来到上海，也欢迎来到 SparkLab。","en":"Welcome to Shanghai, and welcome to SparkLab.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":11,"start_ms":362480,"end_ms":369590,"timestamp":"00:06:02","speaker":"SparkLab 介绍人 Jack","role":"jack","role_confidence":"较高","role_note":null,"original_speaker":"说话人3","zh":"可以把幻灯片切回来一下吗？","en":"Could we bring the slide back for a second?","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":12,"start_ms":369590,"end_ms":381630,"timestamp":"00:06:09","speaker":"现场多人 / 短促插话","role":"group","role_confidence":"低","role_note":null,"original_speaker":"说话人5","zh":"[现场交流，听不清]","en":"[Brief exchange, inaudible]","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":13,"start_ms":381630,"end_ms":401580,"timestamp":"00:06:21","speaker":"现场多人 / 短促插话","role":"group","role_confidence":"低","role_note":null,"original_speaker":"说话人5","zh":"谢谢，我明白了。","en":"Thank you, I understand.","chapter_id":"chapter-1","chapter_title":"活动开场与 SparkLab 介绍","subchapter_id":"chapter-1-2","subchapter_title":"Jack 介绍 SparkLab 的居住式创业社区"},{"index":14,"start_ms":401580,"end_ms":408110,"timestamp":"00:06:41","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"这是我和妻子在世界各地组织的第十场 Indie Hacker 聚会，可能也是目前最疯狂的一场。","en":"This is the tenth Indie Hacker meetup that my wife and I have organized around the world, and probably the craziest one so far.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":15,"start_ms":408110,"end_ms":409940,"timestamp":"00:06:48","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"谢谢大家到场，也谢谢 SparkLab 接待我们。","en":"Thank you all for coming, and thank you to SparkLab for hosting us.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":16,"start_ms":409940,"end_ms":411510,"timestamp":"00:06:49","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"谢谢大家。","en":"Thank you, everyone.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":17,"start_ms":411510,"end_ms":429210,"timestamp":"00:06:51","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"活动原本应该在户外举行，那样我们可能会被太阳烤熟。尽管下着雨，大家还是聚到了这里，真的很棒。再次谢谢各位。","en":"This was supposed to take place outside, where we might have been cooked by the sun. Despite the rain, we're all here together, which is amazing. Thank you again for coming.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":18,"start_ms":429210,"end_ms":464730,"timestamp":"00:07:09","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"接下来我会先讲一个简短的故事，然后我们再开放交流。","en":"I'm going to tell you a short story first, and then we'll open things up.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":19,"start_ms":464730,"end_ms":537790,"timestamp":"00:07:44","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"在我们开始之前，先问几个问题。谁来访但不住在上海？看起来已经是大多数了，所以谢谢你——你来了就更意味着了。谁建立了一个网站，在上面设置了付费墙并发布了它？几乎每个人。谁赚到了第一笔钱或在网上获得了付费客户？谁的收入足以维持生计？如果你不认识我，我是马克。我不是一个伟大的、雄心勃勃的企业家；我自己构建小项目。大多数人从未找到用户或赚了很多钱，但我继续开发，因为我很好奇并且想玩得开心。","en":"Before we begin, a few questions. Who here is visiting and does not live in Shanghai? It looks like a majority, so thank you—it means even more that you came. Who has built a website, put a paywall on it, and published it? Almost everyone. Who has earned their first dollar or acquired a paying customer online? And who earns enough to make a living from it? If you don't know me, I'm Marc. I'm not a grand, ambitious entrepreneur; I build small projects by myself. Most never found users or earned much money, but I keep building because I am curious and want to have fun.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":20,"start_ms":537790,"end_ms":589850,"timestamp":"00:08:57","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我这样做已经有大约十年了。该图表显示了我的项目的收入：大约七年几乎持平，随后最近有所上升。你可能是通过那次崛起之后的推文或视频发现了我，但我的大部分旅程都是重复的失败。我想讲述那个早期的故事。它始于 2015 年的法国，当时我还是一名计算机科学专业的学生。说我学习是很慷慨的——我大部分时间都在玩电子游戏、喝酒或睡觉。","en":"I have been doing this for about ten years. This chart shows the revenue from my projects: almost flat for roughly seven years, followed by a recent rise. You may have discovered me through the tweets or videos that came after that rise, but most of my journey was repeated failure. I want to tell the story of that earlier period. It starts in France in 2015, when I was a computer-science student. Saying I studied is generous—I spent most of my time playing video games, drinking, or sleeping.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-1","subchapter_title":"开场：十年曲线与七年低谷"},{"index":21,"start_ms":589850,"end_ms":608710,"timestamp":"00:09:49","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我抽烟、参加聚会，总体上玩得很开心，但我不知道自己想做什么。当我不得不通过伊拉斯谟式的项目在国外度过六个月时，我的生活开始改变。我的成绩太差，无法获得我想要的名额。","en":"I smoked, partied, and generally had a good time, but I had no idea what I wanted to do. My life began to change when I had to spend six months abroad through an Erasmus-style program. My grades were too poor to qualify for the places I wanted.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-2","subchapter_title":"香港实习、创业幻想与第一次失败"},{"index":22,"start_ms":608710,"end_ms":663190,"timestamp":"00:10:08","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我去香港的唯一途径是实习。我的英语很差，几乎没有什么有用的技能，但我不知怎么找到了六个月的前端工程实习机会。这是一场灾难——我在两周内没有学会编程，而且仍然花了太多时间参加聚会——但独自生活在另一种文化中改变了我对可能性的感觉。它在我的脑海中点燃了一个小火花：也许我不必遵循毕业并找到一份正式工作的传统路径。","en":"The only way I could get to Hong Kong was through an internship. My English was poor and I had almost no useful skills, but I somehow found a six-month front-end engineering internship. It was a disaster—I did not learn programming in two weeks and still spent too much time partying—but living alone in another culture changed my sense of what was possible. It put a small spark in my head: perhaps I did not have to follow the traditional path of graduating and taking a regular job.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-2","subchapter_title":"香港实习、创业幻想与第一次失败"},{"index":23,"start_ms":663190,"end_ms":712290,"timestamp":"00:11:03","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"第二件改变我的事情发生在 2016 年毕业后，当时我观看了马克·扎克伯格创建 Facebook 的电影。我妄想，“这就是我——我是下一个马克·扎克伯格。”这种信念是不切实际的，但它给了我建设的能量。我的想法是开发一款类似 Tinder 的移动应用，将人们与技能水平相似的运动伙伴配对。我和父母住在一起，知道我最终需要承担责任并独立生活。","en":"The second event that changed me came after graduation in 2016, when I watched the film about Marc Zuckerberg creating Facebook. I thought, delusionally,'That is me—I am the next Marc Zuckerberg.' The belief was unrealistic, but it gave me energy to build. My idea was a Tinder-like mobile app that matched people with sports partners at a similar skill level. I was living with my parents and knew I eventually needed to take responsibility and live independently.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-2","subchapter_title":"香港实习、创业幻想与第一次失败"},{"index":24,"start_ms":712290,"end_ms":747150,"timestamp":"00:11:52","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我在巴黎一家咖啡馆做兼职服务员，每小时工资约 10 美元，在创办公司的过程中节省了一点钱。这是我的第一家公司，我几乎做错了所有事情：我对这个想法保密，要求人们签署保密协议，打印名片，就好像他们会带来客户一样，并编写了一个从未进入市场的糟糕应用。","en":"I worked part-time as a waiter in a Paris café for about $10 an hour and saved a little while building the startup. It was my first company, and I did almost everything wrong: I kept the idea secret, asked people to sign NDAs, printed business cards as if they would bring customers, and wrote a poor app that never reached the market.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-2","subchapter_title":"香港实习、创业幻想与第一次失败"},{"index":25,"start_ms":747150,"end_ms":753960,"timestamp":"00:12:27","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我整整一年都处于妄想阶段：我相信我是一个天才，只是人们还没有认识到这一点。","en":"I spent a whole year in a delusional phase: I believed I was a genius and people simply had not recognized it yet.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-2","subchapter_title":"香港实习、创业幻想与第一次失败"},{"index":26,"start_ms":753960,"end_ms":778610,"timestamp":"00:12:33","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"最终，这种幻想以及我当时的关系都崩溃了。有人问这个应用如何赚钱，我没有答案。回到家后，我意识到我花了一年的时间开发了一款糟糕的应用，没有人使用，也没有商业模式。","en":"Eventually that illusion collapsed, along with my relationship at the time. Someone asked how the app would make money, and I had no answer. I went home realizing I had spent a year on a bad app that nobody used and that had no business model.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-2","subchapter_title":"香港实习、创业幻想与第一次失败"},{"index":27,"start_ms":778610,"end_ms":827530,"timestamp":"00:12:58","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我删除了代码并与女朋友分手了。然后，大约三天内，一位朋友打电话说他已从天使投资人那里筹集了 10 万美元，并希望我作为联合创始人前往韩国与他会合。我没有什么可失去的，所以我答应了。我们在首尔生活和工作，试图预测机票价格何时上涨或下跌，以便用户知道购买的最佳时间。","en":"I deleted the code and broke up with my girlfriend. Then, within about three days, a friend called to say he had raised $100,000 from angel investors and wanted me to join him in South Korea as a co-founder. I had nothing to lose, so I said yes. We lived and worked in Seoul, trying to predict when airline-ticket prices would rise or fall so users would know the best time to buy.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-3","subchapter_title":"韩国创业、手套生意与艰难求生"},{"index":28,"start_ms":827530,"end_ms":872750,"timestamp":"00:13:47","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"这个想法在纸面上听起来不错，但我们都是工程师，重复了我的老错误。我们专注于产品，构建了一个有效的 MVP，并花了八个月的时间相信它可以在不与客户交谈或了解盈利的情况下发挥作用。公司最终倒闭了，我也离开了。大约在那个时候，在聚会太多的时候，我遇到了一位很棒的韩国女人，她成了我的女朋友。我们一起尝试了一种完全不同的项目：电子商务。","en":"The idea sounded good on paper, but we were both engineers and repeated my old mistake. We focused on the product, built a functioning MVP, and spent eight months believing it would work without talking to customers or understanding monetization. The company eventually collapsed and I left. Around that time, while partying too much, I met the wonderful Korean woman who became my girlfriend. Together we tried a completely different kind of project: e-commerce.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-3","subchapter_title":"韩国创业、手套生意与艰难求生"},{"index":29,"start_ms":872750,"end_ms":928820,"timestamp":"00:14:32","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我在 Facebook 上看到一则病毒式传播的广告，宣传一款共用手套，可以让情侣在里面牵手。由于我和女朋友住在韩国，我们尝试了针对韩国市场的想法。一位当地妇女为我们手工制作了20或30只手套。我们将这个品牌称为“Glovers”——“恋人的手套”。品牌看起来不错，但我不知道如何营销它。我花光了 Facebook 广告上的小额积蓄，也没有在网上卖过任何东西，所以我们尝试在韩国的冬天在街上卖东西。","en":"I saw a viral Facebook ad for a shared glove that allowed a couple to hold hands inside it. Since I was living in Korea with my girlfriend, we tried the idea for the Korean market. A local woman handmade 20 or 30 gloves for us. We called the brand Glovers—'the glove for lovers.' The branding looked good, but I had no idea how to market it. I burned through my small savings on Facebook ads and sold nothing online, so we tried selling on the street during a Korean winter.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-3","subchapter_title":"韩国创业、手套生意与艰难求生"},{"index":30,"start_ms":928820,"end_ms":972390,"timestamp":"00:15:28","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"当时气温约为负20度。我们喝了一点啤酒来抵御寒冷，并卖出了大约 10 或 20 副手套——大致足以收支平衡。但冬天结束了，一晚卖一只手套已经不是什么生意了。我没有积蓄，所以我在韩国做了一些背景表演的小工作。他们给我化妆，有时还请我跳舞。这很奇怪，但它支付了账单。","en":"It was about minus 20 degrees. We drank a little beer to cope with the cold and sold perhaps 10 or 20 gloves—roughly enough to break even. But winter ended, and selling one glove a night was not a business. I had no savings, so I took small background-acting jobs in Korea. They put makeup on me and sometimes asked me to dance. It was strange, but it paid the bills.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-3","subchapter_title":"韩国创业、手套生意与艰难求生"},{"index":31,"start_ms":972390,"end_ms":995590,"timestamp":"00:16:12","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我每个月挣几百美元，足够买一间又小又便宜的房间了。我的女朋友搬来和我住在一起，考虑到房子很小，这很了不起。然后我遇到了一个名叫安德烈的人，告诉他我很沮丧：我想开发数字产品，但我花了很长时间来开发，却从未接触到客户。","en":"I earned a few hundred dollars a month, enough for a tiny, cheap room. My girlfriend moved in with me, which was remarkable given how small it was. Then I met a man named André and told him I was frustrated: I wanted to build digital products, but I spent so long building that I never reached customers.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-3","subchapter_title":"韩国创业、手套生意与艰难求生"},{"index":32,"start_ms":995590,"end_ms":1051370,"timestamp":"00:16:35","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"安德烈给了我的建议改变了我的生活：“为什么不在建造之前把它卖掉呢？”这对我来说感觉不自然，但两年后我尝试了，但没有成功。我发送了冷冰冰的电子邮件，提供了一种尚不存在的产品。令我惊讶的是，人们回复并同意接听电话。2018 年，在我在日本能找到的最小的房间之一，我感到很高兴，因为潜在客户正在回答我。","en":"André gave me advice that changed my life:'Why don't you sell it before you build it?' That felt unnatural to me, but after two unsuccessful years I tried it. I sent cold emails offering a product that did not yet exist. To my surprise, people replied and agreed to calls. In 2018, from one of the smallest rooms I could find in Japan, I felt happy simply because potential customers were answering me.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-4","subchapter_title":"“先卖再做”：赚到互联网第一美元"},{"index":33,"start_ms":1051370,"end_ms":1072520,"timestamp":"00:17:31","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"当我推销尚未构建的产品时，有一次电话持续了 30 多分钟，尴尬不已。这位名叫丹妮拉（Daniela）的女士答应了并同意购买。经过两年的工作，这成为我在互联网上赚到的第一块钱。","en":"One call lasted more than 30 awkward minutes as I pitched the unbuilt product. The woman, Daniela, said yes and agreed to buy. After two years of work, that became my first dollar earned on the internet.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-4","subchapter_title":"“先卖再做”：赚到互联网第一美元"},{"index":34,"start_ms":1072520,"end_ms":1134660,"timestamp":"00:17:52","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"那次出售成为一项持续了两年多的生意。我在客户的网站上嵌入了一个小游戏；完成该活动的访客会收到一张折扣券，这有助于企业提高转化率。我们搬到了巴厘岛，该产品很快每月赚取约 1,000 至 1,500 美元——足够我们简单地生活了。我早上上网，然后营销业务，下午开发产品。","en":"That sale became a business that lasted more than two years. I embedded a short game on customers' websites; visitors who completed it received a discount coupon, which helped the businesses improve conversion. We moved to Bali, and the product soon earned around $1,000 to $1,500 per month—enough for us to live simply. I surfed in the morning, marketed the business afterward, and worked on the product in the afternoon.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-4","subchapter_title":"“先卖再做”：赚到互联网第一美元"},{"index":35,"start_ms":1134660,"end_ms":1144810,"timestamp":"00:18:54","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我这样生活了大约两年，我觉得我偶然发现了一些新东西。2018年，我没有任何企业家朋友。","en":"I spent about two years living like this, and I felt I had stumbled onto something new. In 2018, I didn't have any entrepreneur friends.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-4","subchapter_title":"“先卖再做”：赚到互联网第一美元"},{"index":36,"start_ms":1144810,"end_ms":1159410,"timestamp":"00:19:04","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"如今，许多人在互联网上构建东西，但当时的人并不多。我感到有点失落，但我很高兴，因为它在某种程度上起作用了。我感觉好像找到了金子。","en":"Today, many people build things on the internet, but back then there weren't many. I felt a little lost, yet I was happy because it was somehow working. I felt as if I had found gold.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-4","subchapter_title":"“先卖再做”：赚到互联网第一美元"},{"index":37,"start_ms":1159410,"end_ms":1209900,"timestamp":"00:19:19","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"然后 2020 年发生了新冠疫情。我销售给的客户是密室逃脱场馆——实体企业。就在我达到最高月收入后，他们不得不关门，我的收入从每月 6,000 美元跌至零。我们搬回法国，我和女朋友结婚了，那是一场美好的婚礼。但现实最终还是找上门来：业务再也没有恢复过来。两年后，我看到大学朋友在巴黎组建家庭并买房。","en":"Then COVID happened in 2020. The customers I sold to were escape rooms—physical businesses. Just after I hit my highest monthly revenue, they had to close, and my revenue fell from $6,000 a month to zero. We moved back to France, my girlfriend and I got married, and it was a beautiful wedding. But reality eventually struck: the business never recovered. After two years in it, I watched university friends start families and buy homes in Paris.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":38,"start_ms":1209900,"end_ms":1243340,"timestamp":"00:20:09","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"有时上完厕所后，还是会有几滴落到裤子里。知道我在说什么吧？","en":"Sometimes after you use the toilet, a few drops still end up in your underwear. You know what I'm talking about.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":39,"start_ms":1243340,"end_ms":1293350,"timestamp":"00:20:43","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我妹妹给我看了一段 TikTok 视频，里面讲了一个可以避免这种情况的动作。我试过以后觉得很有效，于是异想天开地把它做成产品：我写了一份 PDF，教男性怎样解决这个问题，在 Shopify 上卖 2 美元。这个产品无法在 Facebook 等常规平台投广告，我甚至试过去成人视频站投放，但三周一单都没卖出去。","en":"My sister showed me a TikTok video about a maneuver that could prevent this. I tried it and it worked, so I had the delusional idea of turning it into a product. I made a PDF teaching men how to deal with the problem and sold it for $2 on Shopify. I couldn't advertise it on Facebook or other mainstream platforms, so I even tried adult sites. After three weeks, I had made zero dollars.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":40,"start_ms":1293350,"end_ms":1320980,"timestamp":"00:21:33","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我印了带有网站二维码的贴纸，贴到巴黎的公共厕所里——目标用户当时正好就在厕所里，我以为这是个不错的营销点子。但还是没有任何销售。我放弃了这个产品，继续住在父母家，存款见底，也停止照顾自己。","en":"I printed stickers with a QR code to the website and put them in public toilets in Paris. The target customer was literally in the toilet, so I thought it was a clever marketing move. But I got no sales. I let the product go, kept living with my parents, ran out of savings, and stopped taking care of myself.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":41,"start_ms":1320980,"end_ms":1366020,"timestamp":"00:22:00","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我不再照顾自己了。当我照镜子时，我看到了失败。五年后，我感觉自己远远落后于其他人。一天早上，我带着我至今仍不完全理解的愤怒醒来——可能是生自己的气——然后哭着捶打父母家的墙壁。我意识到有些事情必须改变，所以我第一次决定找一份真正的工作，并开始发送冷冰冰的电子邮件。","en":"I stopped taking care of myself. When I looked in the mirror, I saw a failure. After five years, I felt far behind everyone else. One morning I woke with anger I still do not fully understand—probably anger at myself—and cried and punched the wall in my parents' home. I realized something had to change, so for the first time I decided to get a real job and began sending cold emails.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":42,"start_ms":1366020,"end_ms":1397370,"timestamp":"00:22:46","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"做我们在这里所做的工作是有价值的：你学习一点前端、后端和营销，然后你建立了一家互联网初创公司。公司重视这种结合。不到两周的时间，我就从人生的最低谷变成了每月 9,000 美元的软件工程师。五年来几乎一无所获，这个数字让人难以置信。","en":"There is something valuable about doing the kind of work we do here: you learn a little front end, back end, and marketing, and you build an internet startup. Companies value that combination. Within two weeks, I went from the lowest point of my life to receiving a $9,000-a-month offer as a software engineer. After five years of earning almost nothing, that amount felt unbelievable.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":43,"start_ms":1397370,"end_ms":1407870,"timestamp":"00:23:17","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我立即接受了这个提议。我最终为一位著名的美国影响者工作，我在幻灯片上展示了他的照片。","en":"I accepted the offer immediately. I ended up working for a well-known American influencer whose photo I showed on the slide.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":44,"start_ms":1407870,"end_ms":1444740,"timestamp":"00:23:27","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"他在美国很有名，卖课程，有点大师形象。他还遇到了一些法律麻烦。我在一家与他有联系的软件公司工作并开发了应用。在接下来的六个月里，我觉得我再次有了目标：每天早上有人告诉我要做什么，我就这么做了，然后我得到了报酬。经过五年的艰难岁月，这种感觉非常好。","en":"He was very famous in the United States, sold courses, and had a bit of a guru image. He also had some legal trouble. I worked for a software company connected to him and built apps. For the next six months, I felt I had a purpose again: every morning someone told me what to do, I did it, and I got paid. After five difficult years, that felt extremely good.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":45,"start_ms":1444740,"end_ms":1474500,"timestamp":"00:24:04","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"在为他构建应用六个月后，我们带着一些积蓄搬回了巴厘岛。几天后，我连夜被电子邮件解雇，我仍然不知道为什么。不过，这并不完全是坏事，因为大约在那个时候，我在 Twitter 上发现了一些鼓舞人心的人，他们正在互联网上创建初创公司。","en":"After six months of building apps for him, we moved back to Bali with some savings. A few days later, I was fired overnight by email, and I still don't know why. It wasn't entirely bad, though, because around that time I found inspiring people on Twitter who were building startups on the internet.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-5","subchapter_title":"疫情归零、荒诞试验与高薪工作"},{"index":46,"start_ms":1474500,"end_ms":1476620,"timestamp":"00:24:34","speaker":"现场多人 / 短促插话","role":"group","role_confidence":"低","role_note":null,"original_speaker":"说话人1","zh":"好的，非常好，非常好。","en":"Okay, very good, very good.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":47,"start_ms":1476620,"end_ms":1491640,"timestamp":"00:24:36","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"大约在那个时候，我发现了像今天在这里的达蒙这样的人，他们建立了许多互联网初创公司并分享了这段旅程。我发现他们非常鼓舞人心，并且想要那样的生活。","en":"Around that time I discovered people such as Damon, who is here today, building many internet startups and sharing the journey. I found them incredibly inspiring and wanted that kind of life.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":48,"start_ms":1491640,"end_ms":1509060,"timestamp":"00:24:51","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"以前，我很孤独：每当项目失败时，我就从零开始。这些创始人创办了一家初创公司，并在网上分享了这一过程。即使失败了，人们也会继续跟随他们进入下一个项目，因此他们不必从零开始重建一切。","en":"Previously, I had been lonely: whenever a project failed, I restarted from zero. These founders built a startup and shared the process online. Even if it failed, people continued following them into the next project, so they did not have to rebuild everything from zero.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":49,"start_ms":1509060,"end_ms":1524070,"timestamp":"00:25:09","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我决定继续公开创办初创公司，同时再次照顾好自己。我围绕睡眠、食物和锻炼创建了结构——这些都是我以前忽略的。","en":"I decided to keep building startups publicly while also taking care of myself again. I created structure around sleep, food, and exercise—things I had previously ignored.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":50,"start_ms":1524070,"end_ms":1560140,"timestamp":"00:25:24","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"这张幻灯片将 2021 年被解雇又重新开始的我与最近的我进行了比较。我把几件事定为不可协商的：八小时的睡眠、每晚相同的就寝时间、至少一个小时的锻炼以及 80% 到 90% 的时间吃营养食品。然后我只是为了好玩而继续构建随机项目。一个网站根据访问者的感受推荐电影。","en":"The slide compares me in 2021, when I was fired and restarted, with me more recently. I made several things non-negotiable: eight hours of sleep, the same bedtime every night, at least an hour of exercise, and nutritious food 80 to 90 percent of the time. Then I resumed building random projects simply for fun. One site recommended films based on how a visitor felt.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":51,"start_ms":1560140,"end_ms":1581830,"timestamp":"00:26:00","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"没有总体规划。我随机发布了一些项目，经常没有得到点赞，但我继续做下去，因为它很有趣。时事通讯中偶尔会出现一个网站，带来不认识我的访问者。然后一些人在 Twitter 上关注了我，观众慢慢开始增长。","en":"There was no master plan. I published random projects, often received no likes, and kept going because it was fun. Occasionally a site appeared in a newsletter, bringing visitors who did not know me. Some then followed me on Twitter, and the audience slowly began to grow.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":52,"start_ms":1581830,"end_ms":1630470,"timestamp":"00:26:21","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我的粉丝增长缓慢——花了大约八个月的时间才达到 1,000 名粉丝。到 2022 年左右，我有了一些项目，每个月只赚几百美元，但我发现了一个由人们构建类似东西的社区。然后，我尝试更智能地构建，并为每个网站添加了付费专区，因为付款是初创公司得到验证的强烈信号。","en":"My audience grew slowly—it took about eight months to reach 1,000 followers. By around 2022 I had a few projects and was earning only a few hundred dollars a month, but I had found a community of people building similar things. I then tried to build more intelligently and added a paywall to every site, because payment is a strong signal that a startup is validated.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":53,"start_ms":1630470,"end_ms":1675700,"timestamp":"00:27:10","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我开始生产止痛药而不是维生素：这些产品能够解决必须拥有的问题，而不仅仅是拥有它。我了解了设计、定价、一次性付款和订阅，每个项目都变得更加成功。到 2023 年左右，我已经建立了大约 15 个网站，每月收入约为 2,000 至 4,000 美元。我不断重建相同的基础，因为那是在人工智能让工作变得更快之前。","en":"I began building painkillers rather than vitamins: products that solve a must-have problem instead of merely being nice to have. I learned about design, pricing, one-time payments, and subscriptions, and each project became a little more successful. By around 2023 I had built about 15 websites and was earning roughly $2,000 to $4,000 a month. I kept rebuilding the same foundations, because this was before AI made that work much faster.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":54,"start_ms":1675700,"end_ms":1707590,"timestamp":"00:27:55","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"好的。","en":"OK.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-6","subchapter_title":"被解雇后公开构建：健康、社区与小步增长"},{"index":55,"start_ms":1707590,"end_ms":1747160,"timestamp":"00:28:27","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我根本睡不着，因为我几乎每分钟都在查看 Stripe，总能看到一笔新订单。每当我想睡着，整栋楼又开始摇晃。所以我不知道自己究竟是全世界最开心的人，还是当晚就要死掉。那真是一个难忘的夜晚。那就是一切的开始——你看，这就是 ShipFast，这是它后来的增长曲线和产生的收入。它真的改变了我的人生，也开启了一种新的构建方式：去做我自己会用的东西。因为如果我就是第一个重度用户，找到其他客户就容易得多。","en":"I couldn't sleep because I was checking Stripe, like, every single minute; I would see a new sale or something. And when I tried to fall asleep, the building started shaking again. So I didn't know if I was the happiest person or about to die that night. But that was a really unforgettable night. And that was the beginning of—you know, this was ShipFast, and this is ShipFast over time. This is the revenue it has generated, so this is something that has literally changed my life. This was the beginning of a new way of building stuff, where I would build stuff that I use myself. Because if I'm the first power user, then it's much easier to find other customers.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-7","subchapter_title":"台风之夜：产品复利与失败的价值"},{"index":56,"start_ms":1747160,"end_ms":1763790,"timestamp":"00:29:07","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"ZenVoice 解决的是一个很小的问题：Stripe 生成发票时会收取 0.4% 的费用。它不是一门大生意，但不用我持续投入，每月也能赚几百美元。于是我开始反复复制这种策略。","en":"ZenVoice solves a small problem: Stripe charges a 0.4% fee when it generates invoices. It isn't a huge business, but it makes a few hundred dollars a month without much ongoing work. So I kept repeating the same strategy.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-7","subchapter_title":"台风之夜：产品复利与失败的价值"},{"index":57,"start_ms":1763790,"end_ms":1817060,"timestamp":"00:29:23","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"比如 DataFast：它把网站分析与 Stripe 控制台连接起来，让你看到哪些营销渠道真正带来收入。我每天都在用它，也正因为我是它的重度用户，我知道接下来该做什么。它目前每月大约带来 2.5 万美元收入。","en":"For example, DataFast connects web analytics to your Stripe dashboard and shows which marketing channels generate revenue. I use it every day, and because I'm the power user, I know what to build next. It currently makes around $25,000 a month.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-7","subchapter_title":"台风之夜：产品复利与失败的价值"},{"index":58,"start_ms":1817060,"end_ms":1839340,"timestamp":"00:30:17","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"即使现在，我做的很多创业项目仍然会失败。但正是这些失败促成了后来的成功。正如那句名言：‘我一生中一次又一次地失败，这就是我成功的原因。’这也很好地概括了我的经历。","en":"Even now, many startups I build still fail. But those failures are the reason later success became possible. As the quote goes, 'I failed over and over and over again in my life, and that is why I succeeded.' That sums up my journey well.","chapter_id":"chapter-2","chapter_title":"Marc Lou：十年独立创业之路","subchapter_id":"chapter-2-7","subchapter_title":"台风之夜：产品复利与失败的价值"},{"index":59,"start_ms":1839340,"end_ms":1851390,"timestamp":"00:30:39","speaker":"主持人 Chuan","role":"chuan","role_confidence":"高","role_note":null,"original_speaker":"说话人2","zh":"谢谢 Marc 的分享，非常鼓舞人心。在开始问答之前，我们先一起拍一张合照。","en":"Thank you, Marc, for sharing. That was very inspiring. Before the Q&A, let's take a group photo together.","chapter_id":"chapter-3","chapter_title":"合照与问答转场","subchapter_id":"chapter-3-1","subchapter_title":"全场合照"},{"index":60,"start_ms":1851390,"end_ms":1852960,"timestamp":"00:30:51","speaker":"主持团队 / 现场人员","role":"onsite","role_confidence":"中","role_note":null,"original_speaker":"说话人1","zh":"请往这边站一点。","en":"Please move a little this way.","chapter_id":"chapter-3","chapter_title":"合照与问答转场","subchapter_id":"chapter-3-1","subchapter_title":"全场合照"},{"index":61,"start_ms":1852960,"end_ms":1855370,"timestamp":"00:30:52","speaker":"主持团队 / 现场人员","role":"onsite","role_confidence":"中","role_note":null,"original_speaker":"说话人2","zh":"请面向那边。","en":"Please face that way.","chapter_id":"chapter-3","chapter_title":"合照与问答转场","subchapter_id":"chapter-3-1","subchapter_title":"全场合照"},{"index":62,"start_ms":1855370,"end_ms":1867120,"timestamp":"00:30:55","speaker":"主持团队 / 现场人员","role":"onsite","role_confidence":"中","role_note":null,"original_speaker":"说话人1","zh":"大家注意安全。第二排可以吗？","en":"Please watch your step. Is the second row okay?","chapter_id":"chapter-3","chapter_title":"合照与问答转场","subchapter_id":"chapter-3- 人（姓名未知）","role":"qa_moderator","role_confidence":"中","role_note":null,"original_speaker":"说话人8","zh":"您有什么获得更好睡眠的实用技巧吗？","en":"Do you have any practical tips for getting better sleep?","chapter_id":"chapter-4","chapter_title":"现场问答（一）：生活、产品与市场选择","subchapter_id":"chapter-4-4","subchapter_title":"健康、睡眠与创业续航"},{"index":126,"start_ms":2628800,"end_ms":2659310,"timestamp":"00:43:48","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"中国有空调，所以要保持房间凉爽。每晚在同一时间上床睡觉——即使是周末也是如此。让房间完全黑暗。睡前一小时避免屏幕、工作或任何要求较高的活动，睡前约两个小时避免进食，这样您的身体会感觉更轻松。","en":"You have air conditioning in China, so keep the room cool. Go to bed at the same time every night—even on weekends. Make the room completely dark. Avoid screens, work, or anything demanding for an hour before bed, and avoid food for about two hours before bed so your body feels lighter.","chapter_id":"chapter-4","chapter_title":"现场问答（一）：生活、产品与市场选择","subchapter_id":"chapter-4-4","subchapter_title":"健康、睡眠与创业续航"},{"index":127,"start_ms":2659310,"end_ms":2660880,"timestamp":"00:44:19","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"这有助于您在就寝时感觉身体更轻松。","en":"That helps your body feel lighter at bedtime.","chapter_id":"chapter-4","chapter_title":"现场问答（一）：生活、产品与市场选择","subchapter_id":"chapter-4-4","subchapter_title":"健康、睡眠与创业续航"},{"index":128,"start_ms":2660880,"end_ms":2667400,"timestamp":"00:44:20","speaker":"Q&A 串场者 / 主问人（姓名未知）","role":"qa_moderator","role_confidence":"中","role_note":null,"original_speaker":"说话人8","zh":"您是否也练习间歇性禁食以在白天保持头脑清醒？","en":"Do you also practice intermittent fasting to keep your mind clear during the day?","chapter_id":"chapter-4","chapter_title":"现场问答（一）：生活、产品与市场选择","subchapter_id":"chapter-4-4","subchapter_title":"健康、睡眠与创业续航"},{"index":129,"start_ms":2667400,"end_ms":2684270,"timestamp":"00:44:27","speaker":"Marc Lou","role":"marc","role_confidence":"高","role_note":null,"original_speaker":"说话人6","zh":"我尝试过低碳水
