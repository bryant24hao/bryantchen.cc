  <title>课件</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;

      background: Canvas; color: CanvasText;
    }
    form { width: min(22rem, calc(100vw - 2.5rem)); display: grid; gap: 0.85rem; }

    p { margin: 0; color: color-mix(in srgb, CanvasText 58%, Canvas); font-size: 0.9rem; }
    input[type=password], button {
      font: inherit; box-sizing: border-box; width: 100%;
      border-radius: 10px; padding: 0.7rem 0.8rem;
    }
    input[type=password] {
      border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas);
      background: Canvas; color: CanvasText;
    }
    label.rem { display: flex; align-items: center; gap: 0.45rem; font-size: 0.9rem;
      color: color-mix(in srgb, CanvasText 70%, Canvas); cursor: pointer; }
    button { border: 0; cursor: pointer; font-weight: 600; background: CanvasText; color: Canvas; }
    button:disabled { opacity: .6; cursor: progress; }
    .err { color: #c2410c; }
    [hidden] { display: none !important; }
  </style>

  <script>
  (function(){
    var P = JSON.parse(document.getElementById('payload').textContent);
    var b64 = function(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
    var toB64 = function(buf){ var u = new Uint8Array(buf), s=''; for (var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
    var STORE = 'talkgate:v1:' + location.pathname.replace(/index\.html$/,'') + ':' + P.salt;
    var form = document.getElementById('gate'), pw = document.getElementById('pw'),
        err = document.getElementById('err'), rem = document.getElementById('rem'), go = document.getElementById('go');
    function decryptWith(rawKey){
      return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']).then(function(k){
        return crypto.subtle.decrypt({name:'AES-GCM', iv: b64(P.iv)}, k, b64(P.ct));
      }).then(function(buf){ return new TextDecoder().decode(buf); });
    }
    function derive(pass){
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']).then(function(base){
        return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt: b64(P.salt), iterations: P.iter}, base, 256);
      });
    }
    function show(html){ document.open(); document.write(html); document.close(); }
    try {
      var saved = localStorage.getItem(STORE);
      if (saved) {
        decryptWith(b64(saved)).then(show).catch(function(){ try{localStorage.removeItem(STORE)}catch(e){} });
      }
    } catch(e) {}
    form.addEventListener('submit', function(e){
      e.preventDefault();
      err.hidden = true; go.disabled = true; go.textContent = '解锁中…';
      var raw;
      derive(pw.value).then(function(bits){ raw = bits; return decryptWith(bits); }).then(function(html){
        if (rem.checked) { try { localStorage.setItem(STORE, toB64(raw)); } catch(e) {} }
        show(html);
      }).catch(function(){
        err.hidden = false; go.disabled = false; go.textContent = '继续'; pw.select();
      });
    });
  })();
  </script>
